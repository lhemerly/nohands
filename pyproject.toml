[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nohands-codex"
version = "0.1.0"
description = "Local, audio-first control and feedback for Codex CLI on Linux."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luiz Hemerly" }]
dependencies = [
  "moonshine-voice>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nohands = "nohands.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nohands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
